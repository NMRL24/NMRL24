<svg width="320" height="340" viewBox="0 0 320 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chipBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2030"/>
      <stop offset="100%" stop-color="#11141d"/>
    </linearGradient>
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ddbd9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3ddbd9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background circuit traces -->
  <g stroke="#3ddbd9" stroke-width="2" opacity="0.35" fill="none">
    <path d="M10 60 H70 V30 H130"/>
    <path d="M10 280 H60 V310 H150"/>
    <path d="M310 70 H250 V40 H190"/>
    <path d="M310 260 H260 V300 H180"/>
    <circle cx="130" cy="30" r="4" fill="#3ddbd9"/>
    <circle cx="190" cy="40" r="4" fill="#3ddbd9"/>
    <circle cx="150" cy="310" r="4" fill="#3ddbd9"/>
    <circle cx="180" cy="300" r="4" fill="#3ddbd9"/>
  </g>

  <!-- antenna -->
  <line x1="160" y1="70" x2="160" y2="40" stroke="#e8b454" stroke-width="4" stroke-linecap="round"/>
  <circle cx="160" cy="34" r="9" fill="url(#ledGlow)"/>
  <circle cx="160" cy="34" r="5" fill="#e8b454"/>

  <!-- pins: top -->
  <g fill="#e8b454">
    <rect x="95" y="62" width="8" height="18"/>
    <rect x="118" y="62" width="8" height="18"/>
    <rect x="196" y="62" width="8" height="18"/>
    <rect x="219" y="62" width="8" height="18"/>
  </g>
  <!-- pins: bottom -->
  <g fill="#e8b454">
    <rect x="95" y="258" width="8" height="18"/>
    <rect x="118" y="258" width="8" height="18"/>
    <rect x="196" y="258" width="8" height="18"/>
    <rect x="219" y="258" width="8" height="18"/>
  </g>
  <!-- pins: left -->
  <g fill="#e8b454">
    <rect x="62" y="95" width="18" height="8"/>
    <rect x="62" y="118" width="18" height="8"/>
    <rect x="62" y="196" width="18" height="8"/>
    <rect x="62" y="219" width="18" height="8"/>
  </g>
  <!-- pins: right -->
  <g fill="#e8b454">
    <rect x="240" y="95" width="18" height="8"/>
    <rect x="240" y="118" width="18" height="8"/>
    <rect x="240" y="196" width="18" height="8"/>
    <rect x="240" y="219" width="18" height="8"/>
  </g>

  <!-- chip body -->
  <rect x="80" y="80" width="160" height="160" rx="22" fill="url(#chipBody)" stroke="#3ddbd9" stroke-width="2.5"/>

  <!-- notch (orientation marker, like a real IC) -->
  <path d="M140 80 a20 20 0 0 0 40 0 Z" fill="#0a0d13" stroke="#3ddbd9" stroke-width="2"/>

  <!-- face -->
  <circle cx="128" cy="155" r="15" fill="#e9edf3"/>
  <circle cx="192" cy="155" r="15" fill="#e9edf3"/>
  <circle cx="131" cy="158" r="7" fill="#11141d"/>
  <circle cx="195" cy="158" r="7" fill="#11141d"/>
  <circle cx="133" cy="155" r="2.4" fill="#ffffff"/>
  <circle cx="197" cy="155" r="2.4" fill="#ffffff"/>

  <path d="M128 190 Q160 212 192 190" stroke="#3ddbd9" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- cheeks -->
  <circle cx="112" cy="178" r="7" fill="#e8b454" opacity="0.35"/>
  <circle cx="208" cy="178" r="7" fill="#e8b454" opacity="0.35"/>

  <!-- little die label -->
  <text x="160" y="228" text-anchor="middle" font-family="monospace" font-size="11" fill="#565d70">RTL→GDSII</text>

  <!-- holding a tiny probe/wand -->
  <g transform="translate(232,190) rotate(28)">
    <rect x="0" y="0" width="6" height="46" rx="3" fill="#8a92a6"/>
    <circle cx="3" cy="-4" r="7" fill="#3ddbd9"/>
  </g>
  <ellipse cx="248" cy="205" rx="10" ry="9" fill="#e9edf3"/>
</svg>
